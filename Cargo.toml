[package]
name = "typebird"
version = "0.1.0"
edition = "2024"
description = "voice typing for linux. press a key, talk, and the words appear as you speak."
license = "MIT"
repository = "https://github.com/Sran012/typebird"
homepage = "https://github.com/Sran012/typebird"
readme = "README.md"
authors = ["Sujal Rana"]
keywords = ["speech-to-text", "whisper", "linux", "wayland", "dictation"]
categories = ["accessibility", "command-line-utilities", "multimedia::audio"]

[dependencies]
cpal = "0.15"
hound = "3.5"
evdev = "0.12"
eframe = "0.29"
egui = "0.29"
x11-dl = "2.21"

[[bin]]
name = "typebird"
path = "src/main.rs"

[[bin]]
name = "typebird-pill"
path = "src/pill.rs"

[profile.release]
strip = true
lto = "thin"
