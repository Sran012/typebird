[package]
name = "typebird"
version = "0.1.0"
edition = "2024"
description = "voice typing for linux. one binary, one model, every app."

[dependencies]
cpal = "0.15"
hound = "3.5"
evdev = "0.12"
eframe = "0.29"
egui = "0.29"

[[bin]]
name = "typebird"
path = "src/main.rs"

[[bin]]
name = "typebird-pill"
path = "src/pill.rs"
