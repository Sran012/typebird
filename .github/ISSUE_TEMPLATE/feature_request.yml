name: Feature request
description: Suggest a change or a new capability.
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem first, not just the solution. What are you trying to do?
  - type: textarea
    id: problem
    attributes:
      label: The problem
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Hotkey, Transcription, Typing, Overlay, Installer, Docs, Other]
    validations:
      required: true
