name: Bug report
description: Something broke or does not work as expected.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please run `typebird doctor` and paste the output below.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: typebird doctor
      description: Paste the output. Redact anything private.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: typebird version
      description: Output of `typebird --version`.
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Distribution and desktop
      placeholder: Ubuntu 24.04, GNOME 46, Wayland
    validations:
      required: true
  - type: dropdown
    id: session
    attributes:
      label: Session
      options: [Wayland, X11, Not sure]
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install?
      options: [Release installer, Tarball, Built from source]
    validations:
      required: true
